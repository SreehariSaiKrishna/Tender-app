AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Tender Intelligence Agent - BACKEND stack: the pipeline Lambda (scheduled
  2x/day), the API Lambda + HTTP API behind a Cognito login, secrets from
  SSM Parameter Store, and a CloudWatch alarm on failure. The frontend (S3 + CloudFront)
  is a deliberately separate stack - see frontend/template.yaml - so the
  two can be deployed and reasoned about independently. The report email
  itself (Phase 6) isn't built yet - the evening run already passes
  include_report:true so nothing needs to change here once it is.

Parameters:
  AlertEmail:
    Type: String
    Description: >
      Email address to receive a notification when a scheduled pipeline
      run fails (login broke, Atlas unreachable, etc).
  FrontendUrl:
    Type: String
    AllowedPattern: "^https://[^/]+$"
    Description: >
      The dashboard's CloudFront origin (the frontend stack's FrontendUrl
      output, no trailing slash) - the only origin CORS allows and the only
      place Cognito will redirect back to after login. scripts/deploy.sh
      reads it from the frontend stack automatically.

Resources:
  PipelineFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      # Was 600s before the download_documents/summarize_documents steps
      # were added (each eligible tender now costs an extra detail-page
      # navigation + file downloads + an AI call) - raised to the Lambda
      # maximum so a batch of DOCUMENTS_BATCH_LIMIT tenders has room to
      # finish instead of being killed mid-run.
      Timeout: 900
      MemorySize: 1536
      Architectures:
        - x86_64
      # Not primarily about cost - this makes it structurally impossible for
      # a manual test invoke to overlap with a real scheduled run (which
      # would mean two simultaneous Chromium sessions logging into
      # TenderDetail and double the OpenAI calls for that pass).
      ReservedConcurrentExecutions: 1
      # All SSM params here are plain String, not SecureString - CloudFormation
      # does not support resolving ssm-secure references inside a Lambda's
      # Environment.Variables at all (a hard limitation, not a config
      # mistake); access control instead comes from IAM restricting who can
      # call ssm:GetParameter on this path. Dynamic references require an
      # explicit version - rotating a secret in SSM means bumping the
      # version number here too.
      Environment:
        Variables:
          TENDERDETAIL_BASE_URL: "https://www.tenderdetail.com"
          TENDERDETAIL_LOGIN_URL: "https://www.tenderdetail.com/registeruser/dashboard"
          TENDERDETAIL_USERNAME: "{{resolve:ssm:/tender-agent/tenderdetail-username:1}}"
          TENDERDETAIL_PASSWORD: "{{resolve:ssm:/tender-agent/tenderdetail-password:2}}"
          TENDERDETAIL_PROFILE_DIR: "/tmp/browser_profile"
          BROWSER_HEADLESS: "true"
          MONGODB_URI: "{{resolve:ssm:/tender-agent/mongodb-uri:2}}"
          MONGODB_DB_NAME: "tender_intelligence"
          AI_PROVIDER: "openai"
          OPENAI_API_KEY: "{{resolve:ssm:/tender-agent/openai-api-key:2}}"
          OPENAI_MODEL: "gpt-4o-mini"
          AI_RELEVANCE_THRESHOLD: "60"
          LOG_LEVEL: "INFO"
          DOWNLOAD_DIR: "/tmp/raw"
          PROCESSED_DIR: "/tmp/processed"
          DOCUMENTS_DIR: "/tmp/documents"
          DOCUMENTS_BATCH_LIMIT: "15"
          # Tender document text is written here (see app.storage).
          FILES_BUCKET: !Ref FilesBucket
      # Only what the pipeline does with FilesBucket: the summarizer writes
      # tender-text/, cleanup deletes it. No access to company documents or
      # bid packs, and none to the bucket's own settings.
      Policies:
        - Statement:
            - Sid: WriteTenderText
              Effect: Allow
              Action:
                - s3:PutObject
                - s3:DeleteObject
              Resource: !Sub "${FilesBucket.Arn}/tender-text/*"
      Events:
        MorningRun:
          Type: Schedule
          Properties:
            Name: tender-agent-morning
            Description: 08:00 IST daily run
            Schedule: cron(30 2 * * ? *)
            Input: '{"include_report": false}'
        EveningRun:
          Type: Schedule
          Properties:
            Name: tender-agent-evening
            Description: 18:00 IST daily run - the one that also emails the report
            Schedule: cron(30 12 * * ? *)
            Input: '{"include_report": true}'
    Metadata:
      DockerTag: pipeline-latest
      DockerContext: .
      Dockerfile: Dockerfile

  # Login for the dashboard. Accounts are created by an admin only (see
  # scripts/manage-users.sh) - there is no public sign-up - and every user
  # must enrol an authenticator app (TOTP) on first login: this API can
  # download the company's documents and stamp the authorised signatory's
  # signature and seal, so a password alone isn't enough.
  UserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: tender-agent-users
      DeletionProtection: ACTIVE
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      MfaConfiguration: "ON"
      EnabledMfas: [SOFTWARE_TOKEN_MFA]
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          TemporaryPasswordValidityDays: 3
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1

  # Hosted login page: https://<domain>.auth.<region>.amazoncognito.com
  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      Domain: !Sub "tender-agent-${AWS::AccountId}"

  # A public (browser) client: no secret. The dashboard's own sign-in screens
  # send the email + password straight to Cognito's API over HTTPS
  # (USER_PASSWORD_AUTH), then walk the challenges it returns - new password,
  # authenticator setup, 6-digit code - and the password reset flow. The
  # OAuth/hosted-page settings are no longer used by the dashboard.
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: tender-dashboard
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email]
      SupportedIdentityProviders: [COGNITO]
      CallbackURLs: [!Sub "${FrontendUrl}/"]
      LogoutURLs: [!Sub "${FrontendUrl}/"]
      ExplicitAuthFlows: [ALLOW_USER_PASSWORD_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      # Minutes a sign-in may sit between steps (the most Cognito allows) -
      # enough to install an authenticator app and scan the code.
      AuthSessionValidity: 15
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 12
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: hours

  # Explicit (not the SAM-implicit one) so it can carry the CORS config and
  # the Cognito authorizer. Every route requires a valid access token from
  # UserPoolClient except GET /health (see ApiFunction's ApiHealth event);
  # API Gateway rejects the rest with a 401 before ApiFunction even runs.
  # CORS preflight (OPTIONS) is answered by API Gateway itself, ahead of the
  # authorizer, and only for the dashboard's own origin.
  TenderHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: [!Ref FrontendUrl]
        AllowMethods: ["GET", "POST", "PUT", "DELETE"]
        AllowHeaders: ["content-type", "authorization"]
      Auth:
        Authorizers:
          CognitoJwt:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
              # Matched against the access token's client_id claim.
              audience:
                - !Ref UserPoolClient
        DefaultAuthorizer: CognitoJwt
      # Caps how hard anyone - even a signed-in user or a leaked token - can
      # hit the API (and so the OpenAI bill behind generate-bid/checklist).
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      # TenderHttpApi (an HTTP API) has a hard, non-configurable 30s
      # integration timeout that this Timeout can't raise, so API requests
      # are still cut off at 30s. This limit is for the bid-pack build POST
      # /tenders/{id}/generate-bid hands off to this same function as an
      # async invocation (app.api.main._run_bid_generation) - AI drafting
      # plus the PDF merge regularly takes longer than 30s. Keep it under
      # app.api.main._BID_GENERATION_TIMEOUT.
      Timeout: 300
      # Lambda's CPU share scales with memory - 512 MB is ~1/3 of a vCPU,
      # too slow for /generate-bid's PDF build (merging and stamping every
      # attached page) inside the 30s limit. 2048 MB gives more than one vCPU.
      MemorySize: 2048
      Architectures:
        - x86_64
      Environment:
        Variables:
          MONGODB_URI: "{{resolve:ssm:/tender-agent/mongodb-uri:2}}"
          MONGODB_DB_NAME: "tender_intelligence"
          # POST /tenders/{id}/generate-bid's AI-drafted documents (see
          # app.intelligence.bid_drafter) - same parameters PipelineFunction
          # uses for AI screening.
          AI_PROVIDER: "openai"
          OPENAI_API_KEY: "{{resolve:ssm:/tender-agent/openai-api-key:2}}"
          OPENAI_MODEL: "gpt-4o-mini"
          # Submission checklist only - see app.config's checklist_model.
          CHECKLIST_MODEL: "gpt-4.1"
          # Bid-pack letters/declarations only - see app.config's draft_model.
          DRAFT_MODEL: "gpt-4.1"
          # A checklist waiting on a tender's documents has PipelineFunction
          # fetch them right away (see app.api.main._start_document_fetch)
          # instead of waiting for the next scheduled run.
          PIPELINE_FUNCTION_NAME: !Ref PipelineFunction
          # Company documents, tender document text and bid packs (see app.storage).
          FILES_BUCKET: !Ref FilesBucket
          # The dashboard's origin, allowed by the app's CORSMiddleware too
          # (see app.api.main) - same value TenderHttpApi's CORS allows.
          FRONTEND_URL: !Ref FrontendUrl
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref PipelineFunction
        # Invoking itself for the bid-pack build (see Timeout above). By
        # name pattern - !GetAtt ApiFunction.Arn here would be circular.
        - Statement:
            - Sid: InvokeSelfForBidPack
              Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-ApiFunction-*"
        # Object access by prefix only - nothing on the bucket's own settings
        # (lifecycle, policy, ACLs), so a compromised function can't switch
        # off the bid-pack expiry or open the bucket up.
        - Statement:
            - Sid: CompanyDocumentsAndBidPacks
              Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
                - s3:DeleteObject
              Resource:
                - !Sub "${FilesBucket.Arn}/company-documents/*"
                - !Sub "${FilesBucket.Arn}/bid-packs/*"
            - Sid: ReadTenderText
              Effect: Allow
              Action: s3:GetObject
              Resource: !Sub "${FilesBucket.Arn}/tender-text/*"
            # Without it S3 answers a missing key with 403 instead of 404, and
            # a deleted file would look like a permissions failure.
            - Sid: MissingKeysReadAsNotFound
              Effect: Allow
              Action: s3:ListBucket
              Resource: !GetAtt FilesBucket.Arn
      # Root ("/") and every subpath need separate event mappings - API
      # Gateway's {proxy+} wildcard does not also match the bare root path.
      Events:
        # Public, for uptime checks - the one route with no login.
        ApiHealth:
          Type: HttpApi
          Properties:
            ApiId: !Ref TenderHttpApi
            Path: /health
            Method: GET
            Auth:
              Authorizer: NONE
        ApiRoot:
          Type: HttpApi
          Properties:
            ApiId: !Ref TenderHttpApi
            Path: /
            Method: ANY
        ApiProxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref TenderHttpApi
            Path: /{proxy+}
            Method: ANY
        # ANY above also matches OPTIONS, so without this the browser's CORS
        # preflight (which never carries the Authorization header) hits the
        # Cognito authorizer and gets a 401 instead of TenderHttpApi's
        # CorsConfiguration answer. Only OPTIONS is exempted - every real
        # method still requires a token.
        ApiPreflight:
          Type: HttpApi
          Properties:
            ApiId: !Ref TenderHttpApi
            Path: /{proxy+}
            Method: OPTIONS
            Auth:
              Authorizer: NONE
    Metadata:
      DockerTag: api-latest
      DockerContext: .
      Dockerfile: app/api/Dockerfile

  # File storage for both functions (app.storage): the Documents library
  # (PAN, ITRs, financials, signatures - hence private, encrypted, TLS-only
  # and versioned), each tender's document text, and bid packs, which are
  # never kept - the browser downloads them through a 5-minute presigned
  # link and the bid-packs/ rule deletes them after a day. Retained if the
  # stack is ever deleted, so the company's documents can't go with it.
  FilesBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "tender-agent-files-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      # A deleted or replaced company document can be restored for 30 days
      # (other prefixes expire their old versions sooner - see the rules below).
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireBidPacks
            Status: Enabled
            Prefix: bid-packs/
            ExpirationInDays: 1
            NoncurrentVersionExpiration:
              NoncurrentDays: 1
          # A closed tender's text is deleted with the tender (see
          # app.processing.cleanup) - its old version isn't kept around.
          - Id: ExpireDeletedTenderText
            Status: Enabled
            Prefix: tender-text/
            NoncurrentVersionExpiration:
              NoncurrentDays: 1
          - Id: ExpireOldVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
            ExpiredObjectDeleteMarker: true
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

  FilesBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FilesBucket
      PolicyDocument:
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt FilesBucket.Arn
              - !Sub "${FilesBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: tender-agent-alerts

  AlertEmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref AlertTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  PipelineErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: A scheduled pipeline run failed (see the PipelineFunction CloudWatch Logs for why).
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref PipelineFunction
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic

Outputs:
  PipelineFunctionName:
    Value: !Ref PipelineFunction
  AlertTopicArn:
    Value: !Ref AlertTopic
  FilesBucketName:
    Description: For the one-off migration scripts (scripts/migrate_files_to_s3.py)
    Value: !Ref FilesBucket
  ApiUrl:
    Description: Base URL for the tender API (every route but /health needs a Cognito access token)
    Value: !Sub "https://${TenderHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  UserPoolId:
    Description: For scripts/manage-users.sh (adding/removing dashboard users)
    Value: !Ref UserPool
  UserPoolClientId:
    Description: Baked into index.html by scripts/deploy-frontend.sh
    Value: !Ref UserPoolClient
  CognitoDomain:
    Description: The hosted login page's base URL - baked into index.html by scripts/deploy-frontend.sh
    Value: !Sub "https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com"
