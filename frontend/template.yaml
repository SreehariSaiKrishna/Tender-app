AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Tender Intelligence Agent - FRONTEND stack: S3 (private, holds the static
  dashboard files) + CloudFront (public HTTPS in front of it). Deliberately
  its own stack, separate from ../template.yaml (the backend: pipeline
  Lambda, API Lambda, schedules, alarm) - the two are unrelated at the
  infrastructure level; the dashboard's only link to the backend is one
  API URL baked into index.html as a plain static value at upload time
  (see scripts/deploy-frontend.sh), not a CloudFormation reference.

# Only used to build the Content-Security-Policy below - scripts/
# deploy-frontend.sh passes the backend stack's outputs in.
Parameters:
  ApiUrl:
    Type: String
    Default: ""
    Description: The backend stack's ApiUrl output
  CognitoDomain:
    Type: String
    Default: ""
    Description: The backend stack's CognitoDomain output (the hosted login page)

Resources:
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "tender-agent-frontend-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # Origin Access Control - the current recommended way to let CloudFront
  # read a private S3 bucket (replaces the older, deprecated OAI pattern).
  # The bucket itself stays fully private; only this specific distribution
  # can read from it, enforced by the bucket policy's Condition below.
  FrontendOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Browser-side hardening for the dashboard page. The CSP matters most:
  # the page holds the user's login tokens, so it only lets the page talk
  # to this origin, the API, the Cognito login endpoints and the pdf.js CDN.
  # 'unsafe-inline' is needed because the dashboard's script and styles are
  # inline in index.html. blob:/data: cover the rendered PDFs and images
  # (document view, stamp preview) the page builds itself.
  FrontendSecurityHeaders:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "${AWS::StackName}-security-headers"
        SecurityHeadersConfig:
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          # Keeps the one-time ?code= from the login redirect out of any
          # Referer header.
          ReferrerPolicy:
            ReferrerPolicy: no-referrer
            Override: true
          ContentSecurityPolicy:
            Override: true
            ContentSecurityPolicy: !Sub >-
              default-src 'self';
              script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com;
              worker-src 'self' blob: https://cdnjs.cloudflare.com;
              style-src 'self' 'unsafe-inline';
              img-src 'self' blob: data:;
              font-src 'self' data:;
              object-src 'self' blob:;
              connect-src 'self' ${ApiUrl} ${CognitoDomain} https://cdnjs.cloudflare.com;
              frame-ancestors 'none';
              base-uri 'self';
              form-action 'self' ${CognitoDomain}

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2
        Origins:
          - Id: FrontendS3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !Ref FrontendOriginAccessControl
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: FrontendS3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          # AWS managed "CachingOptimized" policy - a fixed, documented ID,
          # not something this account needs to define itself.
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: !Ref FrontendSecurityHeaders
        PriceClass: PriceClass_100

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontServicePrincipalReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                "AWS:SourceArn": !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}"

Outputs:
  FrontendBucketName:
    Description: Upload the dashboard's static files here (aws s3 sync/cp)
    Value: !Ref FrontendBucket
  FrontendDistributionId:
    Description: Needed to invalidate the CloudFront cache after an upload
    Value: !Ref FrontendDistribution
  FrontendUrl:
    Description: The dashboard's public URL
    Value: !Sub "https://${FrontendDistribution.DomainName}"
